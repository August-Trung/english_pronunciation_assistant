<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Duolingo style Flashcards Stack -->
  <circle cx="32" cy="32" r="30" fill="#FFF8E1"/>
  <!-- Back Card (Purple) -->
  <rect x="25" y="14" width="24" height="32" rx="4" fill="#CE82FF" transform="rotate(12 37 30)"/>
  <!-- Middle Card (Blue) -->
  <rect x="18" y="15" width="24" height="32" rx="4" fill="#1CB0F6" transform="rotate(-6 30 31)"/>
  <!-- Front Card (Yellow/Gold) -->
  <rect x="19" y="18" width="26" height="34" rx="4" fill="#FFC800" stroke="#FF9600" stroke-width="2"/>
  <rect x="22" y="21" width="20" height="28" rx="2" fill="#FFFFFF"/>
  <!-- Big Letter 'A' inside front card -->
  <text x="32" y="40" font-family="'Fredoka', sans-serif" font-weight="900" font-size="18" fill="#FF9600" text-anchor="middle">A</text>
  <!-- Sparkle star -->
  <path d="M46 14 l1.5 3 l3 1.5 l-3 1.5 l-1.5 3 l-1.5 -3 l-3 -1.5 l3 -1.5 z" fill="#FF4B4B"/>
</svg>
