<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Duolingo style History Log Clock -->
  <circle cx="32" cy="32" r="30" fill="#E0F7FA"/>
  <!-- Clock Outer Ring -->
  <circle cx="32" cy="32" r="22" fill="#00BCD4"/>
  <circle cx="32" cy="32" r="18" fill="#FFFFFF"/>
  <!-- Clock Hands pointing to 10:10 -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#00838F" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40" y2="32" stroke="#00838F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.5" fill="#00838F"/>
  <!-- Playful circular arrow on edge -->
  <path d="M48 20 A 24 24 0 0 0 16 20" fill="none" stroke="#FF9600" stroke-width="3" stroke-linecap="round"/>
  <polygon points="14,14 18,22 10,22" fill="#FF9600"/>
</svg>
