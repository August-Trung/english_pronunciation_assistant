<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Duolingo style Homework Clipboard -->
  <circle cx="32" cy="32" r="30" fill="#FFF3E0"/>
  <!-- Clipboard Board -->
  <rect x="18" y="14" width="28" height="38" rx="5" fill="#FF9600"/>
  <!-- Paper Sheet -->
  <rect x="21" y="18" width="22" height="31" rx="3" fill="#FFFFFF"/>
  <!-- Top Clip -->
  <rect x="27" y="12" width="10" height="5" rx="2" fill="#E65100"/>
  <!-- Check lines -->
  <circle cx="25" cy="25" r="1.5" fill="#58CC02"/>
  <rect x="29" y="24" width="11" height="2" rx="1" fill="#E0E0E0"/>
  <circle cx="25" cy="31" r="1.5" fill="#58CC02"/>
  <rect x="29" y="30" width="10" height="2" rx="1" fill="#E0E0E0"/>
  <circle cx="25" cy="37" r="1.5" fill="#58CC02"/>
  <rect x="29" y="36" width="8" height="2" rx="1" fill="#E0E0E0"/>
  <!-- Cute Chubby Pencil -->
  <g transform="rotate(-30 46 42)">
    <rect x="42" y="24" width="6" height="20" rx="1" fill="#FFC800"/>
    <path d="M42 44 l3 6 l3 -6 z" fill="#D7CCC8"/>
    <path d="M44 48 l1 2 l1 -2 z" fill="#3E2723"/>
    <rect x="42" y="24" width="6" height="4" fill="#FF4B4B"/>
  </g>
</svg>
