<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Duolingo style Cheerful Star with Face -->
  <!-- Star Outer Shadow/Border -->
  <polygon points="32,8 39,22 54,24 43,35 46,50 32,42 18,50 21,35 10,24 25,22" fill="#E5A500"/>
  <!-- Star Body -->
  <polygon points="32,10 38.5,23 52.5,25 42,35.5 45,49 32,41.5 19,49 22,35.5 11.5,25 25.5,23" fill="#FFD900"/>
  <!-- Highlight -->
  <polygon points="32,14 36,22 45,23 38,30 40,39 32,34 24,39 26,30 19,23 28,22" fill="#FFE57F" opacity="0.6"/>
  <!-- Cute Kawaii Eyes -->
  <circle cx="28" cy="30" r="2.2" fill="#3E2723"/>
  <circle cx="27" cy="29" r="0.8" fill="#FFFFFF"/>
  <circle cx="36" cy="30" r="2.2" fill="#3E2723"/>
  <circle cx="35" cy="29" r="0.8" fill="#FFFFFF"/>
  <!-- Rosy Cheeks -->
  <circle cx="24" cy="33" r="2" fill="#FF8A80" opacity="0.8"/>
  <circle cx="40" cy="33" r="2" fill="#FF8A80" opacity="0.8"/>
  <!-- Little Smile -->
  <path d="M30 33 c0 1.5 2 2 4 0" fill="none" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>
</svg>
