<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Duolingo style Speaking Microphone -->
  <circle cx="32" cy="32" r="30" fill="#E1F5FE"/>
  <!-- Mic base -->
  <path d="M22 50 h20" stroke="#0288D1" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 42 v8" stroke="#0288D1" stroke-width="4" stroke-linecap="round"/>
  <!-- Mic cradle arc -->
  <path d="M20 28 c0 8 5.4 14 12 14 s12 -6 12 -14" fill="none" stroke="#0288D1" stroke-width="4" stroke-linecap="round"/>
  <!-- Mic capsule -->
  <rect x="25" y="14" width="14" height="22" rx="7" fill="#1CB0F6"/>
  <!-- Highlight shine -->
  <rect x="27" y="16" width="3" height="12" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
  <!-- Sound waves -->
  <path d="M48 24 c2 2.5 3 5 3 8 s-1 5.5 -3 8" fill="none" stroke="#FFC800" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 24 c-2 2.5 -3 5 -3 8 s1 5.5 3 8" fill="none" stroke="#FFC800" stroke-width="3" stroke-linecap="round"/>
</svg>
